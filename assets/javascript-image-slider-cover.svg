<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript Image Slider Project Cover</title>
  <desc id="desc">Professional project cover for a responsive image slider built with HTML, CSS and JavaScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset="0.55" stop-color="#081a38"/>
      <stop offset="1" stop-color="#0b63ce"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26c6ff"/>
      <stop offset="1" stop-color="#287cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153c78"/>
      <stop offset="1" stop-color="#07152e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.5" fill="#2e8cff" opacity="0.5"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="875" y="65" width="620" height="430" rx="34"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#dots)" opacity="0.38"/>

  <circle cx="1490" cy="-80" r="340" fill="#27b5ff" opacity="0.14"/>
  <circle cx="1370" cy="520" r="290" fill="#2563eb" opacity="0.18"/>
  <path d="M760 0h840v560H1000C860 430 810 250 760 0Z" fill="#061227" opacity="0.55"/>

  <g transform="translate(72 70)">
    <rect width="72" height="72" rx="17" fill="url(#accent)"/>
    <text x="36" y="49" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" fill="#fff">JS</text>

    <text x="0" y="165" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="1" fill="#fff">IMAGE</text>
    <text x="285" y="165" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="1" fill="url(#accent)">SLIDER</text>

    <rect x="0" y="190" width="620" height="3" rx="2" fill="#2b8cff" opacity="0.72"/>
    <text x="0" y="239" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="9" fill="#d9e9ff">PURE JAVASCRIPT PROJECT</text>

    <text x="0" y="305" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b9ccec">Responsive carousel with smooth controls,</text>
    <text x="0" y="340" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b9ccec">custom scrollbar and mobile-first behaviour.</text>

    <g transform="translate(0 392)">
      <rect width="150" height="54" rx="14" fill="#ffffff" opacity="0.1" stroke="#ff6236" stroke-opacity="0.55"/>
      <text x="20" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ff6b3d">HTML5</text>

      <rect x="170" width="136" height="54" rx="14" fill="#ffffff" opacity="0.1" stroke="#32a8ff" stroke-opacity="0.6"/>
      <text x="190" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#55baff">CSS3</text>

      <rect x="326" width="190" height="54" rx="14" fill="#ffffff" opacity="0.1" stroke="#f7df1e" stroke-opacity="0.65"/>
      <text x="346" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f7df1e">JavaScript</text>

      <rect x="536" width="184" height="54" rx="14" fill="#ffffff" opacity="0.1" stroke="#9b8cff" stroke-opacity="0.65"/>
      <text x="556" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#b9adff">Responsive</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="40" width="670" height="480" rx="42" fill="#050b17" stroke="#2f8fff" stroke-width="4"/>
    <g clip-path="url(#screenClip)">
      <rect x="875" y="65" width="620" height="430" fill="url(#panel)"/>
      <circle cx="1395" cy="120" r="160" fill="#36b5ff" opacity="0.22"/>
      <path d="M875 415 1045 230 1140 330 1240 185 1495 430 1495 495 875 495Z" fill="#1b5fb7"/>
      <path d="M875 455 1060 290 1150 385 1250 225 1495 455 1495 495 875 495Z" fill="#0d2c59"/>
      <path d="M1060 290 1090 325 1117 312 1150 385 1248 225 1285 279 1315 261 1390 350 1495 455 1495 495 875 495Z" fill="#071a36" opacity="0.92"/>
      <path d="M1248 225 1285 279 1315 261 1350 305 1390 350 1450 413" fill="none" stroke="#f5b24c" stroke-width="8" opacity="0.78"/>
      <circle cx="955" cy="280" r="42" fill="#07101f" opacity="0.8" stroke="#fff" stroke-opacity="0.22"/>
      <path d="m969 259-22 21 22 21" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1415" cy="280" r="42" fill="#07101f" opacity="0.8" stroke="#fff" stroke-opacity="0.22"/>
      <path d="m1401 259 22 21-22 21" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(1140 451)">
        <circle cx="0" cy="0" r="8" fill="#fff" opacity="0.8"/>
        <circle cx="30" cy="0" r="10" fill="#2e8cff"/>
        <circle cx="62" cy="0" r="8" fill="#fff" opacity="0.8"/>
        <circle cx="92" cy="0" r="8" fill="#fff" opacity="0.8"/>
      </g>
    </g>
    <circle cx="900" cy="88" r="7" fill="#ff6b5e"/>
    <circle cx="924" cy="88" r="7" fill="#ffc14d"/>
    <circle cx="948" cy="88" r="7" fill="#42d78a"/>
  </g>

  <text x="1510" y="540" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#9fc8ff">MUSA</text>
</svg>